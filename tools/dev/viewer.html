<!doctype html><meta charset="utf-8"><title>viewer</title>
<style>html,body{margin:0;background:#888;overflow:hidden}canvas{display:block}#i{position:fixed;left:6px;top:4px;font:12px monospace;color:#fff;text-shadow:0 0 3px #000;white-space:pre}</style>
<canvas id="c"></canvas><div id="i"></div>
<script src="/lib/three.min.js"></script><script src="/_s/GLTFLoader.js"></script>
<script>
// ?m=/raw/fab/x.glb&a=<anim index|name>&t=<sec>&views=front,q,face|top|side&bg=#hex
const P = new URLSearchParams(location.search), T = THREE;
const r = new T.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true }); r.setSize(innerWidth, innerHeight); r.outputColorSpace = T.SRGBColorSpace; r.toneMapping = T.ACESFilmicToneMapping;
const scene = new T.Scene(); scene.background = new T.Color(P.get('bg') || '#8a97a6');
scene.add(new T.HemisphereLight(0xdfeaff, 0x8a7a66, 1.6)); const sun = new T.DirectionalLight(0xfff2e0, 3.2); sun.position.set(2, 4, 3); scene.add(sun);
const cam = new T.PerspectiveCamera(30, 1, 0.01, 5000);
window.V = { ready: false, err: null };
new T.GLTFLoader().load(P.get('m'), (g) => {
  const root = g.scene; scene.add(root); V.gltf = g; V.root = root;
  let mixer = null; const a = P.get('a');
  if (g.animations.length && a !== 'none') { mixer = new T.AnimationMixer(root); const clip = g.animations.find((c) => c.name === a) || g.animations[+a || 0]; mixer.clipAction(clip).play(); mixer.setTime(+(P.get('t') || 0)); V.clip = clip.name; }
  root.updateMatrixWorld(true);
  const box = new T.Box3(), tmp = new T.Box3(), v = new T.Vector3(); let n = 0, tris = 0;
  root.traverse((o) => { if (o.isMesh) { n++; tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; if (o.isSkinnedMesh) { o.computeBoundingBox(); tmp.copy(o.boundingBox).applyMatrix4(o.matrixWorld); } else tmp.setFromObject(o); box.union(tmp); o.frustumCulled = false; } });
  const size = box.getSize(new T.Vector3()), ctr = box.getCenter(new T.Vector3());
  V.info = { meshes: n, tris, size: size.toArray().map((x) => +x.toFixed(3)), min: box.min.toArray().map((x) => +x.toFixed(3)), max: box.max.toArray().map((x) => +x.toFixed(3)), anims: g.animations.map((c) => c.name + ':' + c.duration.toFixed(1)) };
  document.getElementById('i').textContent = P.get('m') + '\n' + JSON.stringify(V.info);
  const views = (P.get('views') || 'front,q,face').split(','), W = innerWidth / views.length, H = innerHeight, R = Math.max(size.x, size.y, size.z);
  r.setScissorTest(true);
  const draw = () => views.forEach((name, i) => {
    let d = R * 2.3, tgt = ctr.clone(), dir = new T.Vector3(0, 0.1, 1);
    if (name === 'q') dir.set(0.75, 0.25, 0.8); else if (name === 'side') dir.set(1, 0.1, 0); else if (name === 'back') dir.set(-0.5, 0.2, -1); else if (name === 'top') dir.set(0.01, 1, 0.01);
    else if (name === 'face') { tgt.set(ctr.x, box.max.y - size.y * 0.09, ctr.z + size.z * 0.1); d = size.y * 0.42; dir.set(0.25, 0.05, 1); }
    cam.aspect = W / H; cam.updateProjectionMatrix(); cam.position.copy(tgt).addScaledVector(dir.normalize(), d / (2 * Math.tan((cam.fov * Math.PI) / 360)) * 0.62); cam.lookAt(tgt);
    r.setViewport(i * W, 0, W, H); r.setScissor(i * W, 0, W, H); r.render(scene, cam);
  });
  draw(); setTimeout(() => { draw(); V.ready = true; }, 600); V.draw = draw; V.mixer = mixer;
}, undefined, (e) => { V.err = String(e && e.message || e); document.getElementById('i').textContent = 'ERR ' + V.err; });
</script>
